<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>Schlag den Nico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">
    <h1 class="show-title">Schlag den Nico</h1>
    <div id="name-box">
        <input id="player-name" type="text" maxlength="18" placeholder="Gamertag">
    </div>
    <div id="leaderboard">
        <h2>Bestenliste</h2>
        <div class="leaderboard-grid">
            <section>
                <h3>Lokal</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Gamertag</th>
                            <th>Datum</th>
                            <th>Uhrzeit</th>
                            <th>Punkte</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </section>
            <section>
                <h3>Online</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Gamertag</th>
                            <th>Datum</th>
                            <th>Uhrzeit</th>
                            <th>Punkte</th>
                        </tr>
                    </thead>
                    <tbody id="online-leaderboard-body"></tbody>
                </table>
            </section>
        </div>
    </div>
    <div id="question">Frage wird geladen...</div>
    <div id="game-info">
        <div id="timer">15</div>
        <div id="opponent">Nico wartet...</div>
    </div>
    <div id="scoreboard">
        <div id="score-track"></div>
    </div>

    <div id="answers">
        <button class="answer-btn" type="button" onclick="selectAnswer(0)"></button>
        <button class="answer-btn" type="button" onclick="selectAnswer(1)"></button>
        <button class="answer-btn" type="button" onclick="selectAnswer(2)"></button>
        <button class="answer-btn" type="button" onclick="selectAnswer(3)"></button>
    </div>

    <div id="difficulty-box">
        <button class="difficulty-btn active" type="button" data-difficulty="easy" onclick="selectDifficulty('easy')">Einfach</button>
        <button class="difficulty-btn" type="button" data-difficulty="medium" onclick="selectDifficulty('medium')">Mittel</button>
        <button class="difficulty-btn" type="button" data-difficulty="hard" onclick="selectDifficulty('hard')">Schwer</button>
        <button class="difficulty-btn" type="button" data-difficulty="genius" onclick="selectDifficulty('genius')">Genie</button>
    </div>

    <button id="next-btn" onclick="nextQuestion()">Weiter</button>
    <div id="score"></div>
</div>

<script src="script.js"></script>
</body>
</html>
