<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schlag den Nico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="quiz-container">
    <div id="confetti-layer"></div>
    <div id="name-box">
        <input id="player-name" type="text" maxlength="18" placeholder="Gamertag">
        <div id="name-message"></div>
        <div id="account-balance">Konto: 0 €</div>
    </div>
    <div id="leaderboard">
        <h2>Bestenliste</h2>
        <div class="leaderboard-grid">
            <section>
                <h3>Top 10 lokal</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Gamertag</th>
                            <th>Kategorie</th>
                            <th>Datum</th>
                            <th>Zeit</th>
                            <th>Geld</th>
                            <th>Level</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </section>
            <section>
                <h3>Top 10 online</h3>
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Gamertag</th>
                            <th>Konto</th>
                        </tr>
                    </thead>
                    <tbody id="online-leaderboard-body"></tbody>
                </table>
            </section>
        </div>
    </div>
    <div id="question"></div>
    <div id="game-info">
        <div id="timer">15</div>
        <div id="opponent">Nico wartet...</div>
    </div>
    <div id="scoreboard">
        <div id="score-track"></div>
    </div>

    <div id="answers">
        <button class="answer-btn" type="button" onclick="selectAnswer(0)"></button>
        <button class="answer-btn" type="button" onclick="selectAnswer(1)"></button>
        <button class="answer-btn" type="button" onclick="selectAnswer(2)"></button>
        <button class="answer-btn" type="button" onclick="selectAnswer(3)"></button>
    </div>

    <div id="difficulty-box">
        <button class="difficulty-btn active" type="button" data-difficulty="easy" onclick="selectDifficulty('easy')">Einfach</button>
        <button class="difficulty-btn" type="button" data-difficulty="medium" onclick="selectDifficulty('medium')">Mittel</button>
        <button class="difficulty-btn" type="button" data-difficulty="hard" onclick="selectDifficulty('hard')">Schwer</button>
        <button class="difficulty-btn" type="button" data-difficulty="genius" onclick="selectDifficulty('genius')">Genie</button>
    </div>

    <button id="next-btn" onclick="nextQuestion()">Weiter</button>
    <button id="home-btn" type="button" onclick="goHome()">Zum Anfang</button>
    <div id="feedback-box">
        <h3>Feedback oder Bug melden</h3>
        <select id="feedback-type">
            <option value="Feedback">Feedback</option>
            <option value="Bug">Bug</option>
            <option value="Frage falsch">Frage falsch</option>
        </select>
        <textarea id="feedback-message" maxlength="600" placeholder="Was ist dir aufgefallen?"></textarea>
        <button id="feedback-submit" type="button" onclick="submitFeedback()">Absenden</button>
        <div id="feedback-status"></div>
    </div>
    <div id="score"></div>
</div>

<script src="script.js?v=questions-20260507-sport-hard-1"></script>
</body>
</html>
